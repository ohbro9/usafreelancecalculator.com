name: SEO Task 2 Gate

on:
  push:
    branches:
      - feat/seo-growth-v1
  workflow_dispatch:

jobs:
  task2-red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run SEO structure regression
        run: node tests/seo-structure-regression.test.js
