name: SEO Task 2 Gate

on:
  push:
    branches:
      - feat/seo-growth-v1
  workflow_dispatch:

jobs:
  task2-red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect platform trust anchors
        shell: bash
        run: |
          set +e
          for phrase in \
            'Upwork now charges a flat 10% fee on all marketplace contracts' \
            'Upwork: $2 (ACH) / $30 (wire)' \
            'data-platform="Upwork"' \
            'Keep the end-of-page UI premium and compact'; do
            echo "===== $phrase ====="
            grep -n -C 8 -F "$phrase" platform-fee-calculator.html || true
          done
      - name: Run SEO structure regression
        run: node tests/seo-structure-regression.test.js
