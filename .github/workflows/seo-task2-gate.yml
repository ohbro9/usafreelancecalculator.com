name: SEO Task 2 Gate

on:
  push:
    branches:
      - feat/seo-growth-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task2-red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Task 2 trust and public-copy patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one old match, found {count}')
                  p.write_text(text.replace(old, new, 1))
                  print(f'updated {path}')
                  return
              if new in text:
                  print(f'already updated {path}')
                  return
              raise SystemExit(f'{path}: neither old nor new text found')

          old_upwork = '&#9889; Upwork now charges a flat 10% fee on all marketplace contracts. Some special programs may vary from 0&ndash;15%.'
          new_upwork = '''<strong>Fee preset guidance.</strong> Preset rates are illustrative starting points, not universal platform rates. Your actual account or contract fee may differ. Use the fee shown in your account when available, or choose <strong>Custom</strong> to enter the exact rate.
            <div style="margin-top:8px;">Upwork currently documents freelancer service fees from 0% to 15% per contract, with the applicable rate shown before you submit or accept the contract.</div>
            <div style="margin-top:8px;"><strong>Assumptions:</strong> platform fees, special programs, payout methods, currencies, regions, and account terms can change. Confirm the amounts shown by your platform or payout provider before relying on an estimate.</div>
            <div style="margin-top:8px;"><strong>Last reviewed:</strong> September 26, 2026</div>
            <div style="margin-top:8px;"><strong>Official sources:</strong>
              <a href="https://support.upwork.com/hc/en-us/articles/211062538-Learn-about-the-Freelancer-Service-Fee" target="_blank" rel="noopener noreferrer">Upwork</a> &middot;
              <a href="https://help.fiverr.com/hc/en-us/articles/9234443621137-Your-earnings-page" target="_blank" rel="noopener noreferrer">Fiverr</a> &middot;
              <a href="https://www.freelancer.com/feesandcharges" target="_blank" rel="noopener noreferrer">Freelancer.com</a> &middot;
              <a href="https://www.toptal.com/freelance-jobs/faq" target="_blank" rel="noopener noreferrer">Toptal</a> &middot;
              <a href="https://www.guru.com/help/freelancer/about-guru-freelancer/fees/job-fee" target="_blank" rel="noopener noreferrer">Guru</a> &middot;
              <a href="https://support.peopleperhour.com/hc/en-us/articles/205218337-Freelancer-commission-fees" target="_blank" rel="noopener noreferrer">PeoplePerHour</a>
            </div>'''
          replace_once('platform-fee-calculator.html', old_upwork, new_upwork)

          replace_once(
              'platform-fee-calculator.html',
              'Upwork: $2 (ACH) / $30 (wire) &middot; Fiverr: $2 bank, $3 PayPal &middot; Freelancer: $2',
              'Withdrawal and payout fees vary by method, location, currency, and account. Enter the amount shown by your platform or payout provider.'
          )
          replace_once(
              'budget-planner.html',
              'Share the final budget-planning tool without adding a messy social strip.',
              'Share this budget-planning tool with another freelancer.'
          )
          replace_once(
              'hourly-rate-calculator.html',
              'Above the fold, the homepage now stays tighter and more hub-like. The first full tool still starts below, but direct links stay visible immediately.',
              'Use the quick links above to open any calculator directly, or continue with the hourly-rate workflow below.'
          )
          replace_once(
              'platform-fee-calculator.html',
              'Keep the end-of-page UI premium and compact: one native share action, one copy action, and small social share options for quick sending without a noisy icon strip.',
              'Use the share or copy-link options to send this fee calculator quickly on mobile or desktop.'
          )
          replace_once(
              'tax-estimator.html',
              'Share the tax-planning tool without turning the page into a cluttered social block.',
              'Share this tax-planning tool with another freelancer.'
          )
          replace_once(
              'income-goal-planner.html',
              'The section stays separate from the planner actions above so the main tool keeps its premium flow, while sharing still stays easy on mobile and desktop.',
              'Share or copy the link to send this goal planner quickly on mobile or desktop.'
          )
          PY
      - name: Verify Task 2 trust copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('platform-fee-calculator.html').read_text()
          required = [
              'Preset rates are illustrative starting points',
              'actual account or contract fee may differ',
              'Use the fee shown in your account',
              'Last reviewed:</strong> September 26, 2026',
              'https://support.upwork.com/hc/en-us/articles/211062538-Learn-about-the-Freelancer-Service-Fee',
              'https://help.fiverr.com/hc/en-us/articles/9234443621137-Your-earnings-page',
              'https://www.freelancer.com/feesandcharges',
              'https://www.toptal.com/freelance-jobs/faq',
              'https://www.guru.com/help/freelancer/about-guru-freelancer/fees/job-fee',
              'https://support.peopleperhour.com/hc/en-us/articles/205218337-Freelancer-commission-fees',
              'Withdrawal and payout fees vary by method, location, currency, and account.'
          ]
          for item in required:
              if item not in html:
                  raise SystemExit(f'missing Task 2 copy: {item}')
          forbidden = [
              'Upwork now charges a flat 10% fee on all marketplace contracts',
              'Upwork: $2 (ACH) / $30 (wire)',
              'Keep the end-of-page UI premium and compact'
          ]
          for item in forbidden:
              if item in html:
                  raise SystemExit(f'stale Task 2 copy remains: {item}')
          print('Task 2 trust copy: PASS')
          PY
      - name: Run protected calculation regressions
        run: |
          node tests/budget-planner-regression.test.js
          node tests/tax-estimator-regression.test.js
      - name: Commit Task 2 product copy
        shell: bash
        run: |
          if git diff --quiet -- budget-planner.html hourly-rate-calculator.html platform-fee-calculator.html tax-estimator.html income-goal-planner.html; then
            echo "No product-copy changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add budget-planner.html hourly-rate-calculator.html platform-fee-calculator.html tax-estimator.html income-goal-planner.html
          git commit -m "fix: correct public fee and trust copy"
          git push origin HEAD:feat/seo-growth-v1
      - name: Run SEO structure regression and retain expected future REDs
        shell: bash
        run: |
          set +e
          node tests/seo-structure-regression.test.js
          status=$?
          echo "SEO_STATUS=$status"
          exit 0
