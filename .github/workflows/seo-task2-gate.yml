name: SEO Task 2 Gate

on:
  push:
    branches:
      - feat/seo-growth-v1
  workflow_dispatch:

jobs:
  task2-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run protected deterministic regressions
        run: |
          node tests/budget-planner-regression.test.js
          node tests/tax-estimator-regression.test.js
          node tests/android-download-page-release.test.js
      - name: Verify Task 2 trust requirements only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          platform = Path('platform-fee-calculator.html').read_text()
          required = [
              'Preset rates are illustrative starting points',
              'actual account or contract fee may differ',
              'Use the fee shown in your account',
              'Last reviewed:</strong> September 26, 2026',
              'https://support.upwork.com/hc/en-us/articles/211062538-Learn-about-the-Freelancer-Service-Fee',
              'https://help.fiverr.com/hc/en-us/articles/9234443621137-Your-earnings-page',
              'https://www.freelancer.com/feesandcharges',
              'https://www.toptal.com/freelance-jobs/faq',
              'https://www.guru.com/help/freelancer/about-guru-freelancer/fees/job-fee',
              'https://support.peopleperhour.com/hc/en-us/articles/205218337-Freelancer-commission-fees',
              'Withdrawal and payout fees vary by method, location, currency, and account.'
          ]
          forbidden = [
              'Upwork now charges a flat 10% fee on all marketplace contracts',
              'Upwork: $2 (ACH) / $30 (wire)',
              'Keep the end-of-page UI premium and compact',
              'without adding a messy social strip',
              'homepage now stays tighter',
              'without turning the page into a cluttered social block',
              'so the main tool keeps its premium flow'
          ]
          all_pages = '\n'.join(Path(p).read_text() for p in [
              'budget-planner.html', 'hourly-rate-calculator.html', 'platform-fee-calculator.html',
              'tax-estimator.html', 'income-goal-planner.html'
          ])
          for item in required:
              if item not in platform:
                  raise SystemExit(f'missing Task 2 requirement: {item}')
          for item in forbidden:
              if item.lower() in all_pages.lower():
                  raise SystemExit(f'forbidden Task 2 copy remains: {item}')
          print('Task 2 trust/dev-copy requirements: PASS')
          PY
      - name: Install temporary Playwright Chromium
        shell: bash
        run: |
          npm install --prefix /tmp/seo-pw playwright
          /tmp/seo-pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Run Platform Fee browser regression on desktop and Pixel 7
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/seo-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/platform-fee-calculator.html >/dev/null; then break; fi
            sleep 1
          done
          NODE_PATH=/tmp/seo-pw/node_modules node tests/platform-fee-caret.playwright.js
