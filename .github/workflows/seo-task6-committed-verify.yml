name: SEO Task 6 Committed Verify

on:
  push:
    branches:
      - feat/seo-growth-v1
    paths:
      - .github/workflows/seo-task6-committed-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seo-growth-v1
          fetch-depth: 0
      - name: Confirm committed tests
        run: |
          node tests/seo-structure-regression.test.js
          node tests/budget-planner-regression.test.js
          node tests/tax-estimator-regression.test.js
          node tests/android-download-page-release.test.js
          git diff --exit-code
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/task6-committed-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/income-goal-planner.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/task6-committed-http.log
          exit 1
      - name: Confirm committed desktop and mobile behavior
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node .github/tmp/seo-task6-browser.js
      - name: Confirm verification made no tracked changes
        run: git diff --exit-code
