name: SEO Task 5 Committed Verify

on:
  push:
    branches:
      - feat/seo-growth-v1
    paths:
      - .github/workflows/seo-task5-committed-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seo-growth-v1
          fetch-depth: 0

      - name: Confirm committed product metadata and protected tests
        run: |
          git diff --exit-code
          node tests/budget-planner-regression.test.js
          node tests/tax-estimator-regression.test.js
          node tests/android-download-page-release.test.js

      - name: Confirm Task 5 SEO is green with only Task 6 REDs
        run: |
          set +e
          node tests/seo-structure-regression.test.js > /tmp/seo.log 2>&1
          status=$?
          set -e
          cat /tmp/seo.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/seo.log').read_text()
          failures = []
          for line in text.splitlines():
              m = re.match(r'^\d+\. ([^:]+):', line)
              if m:
                  failures.append(m.group(1))
          expected = {
              'income title', 'income h1', 'sitemap includes app page',
              '404 has root-safe home link', '404 has root-safe platform link'
          }
          if set(failures) != expected or len(failures) != 5:
              raise SystemExit(f'Unexpected SEO failures: {failures}')
          print('PASS Task 5 SEO committed state; exactly five Task 6 REDs remain')
          PY
          test "$status" -eq 1

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/platform-fee-calculator.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/http.log
          exit 1

      - name: Verify Platform protected behavior
        env:
          PFC_BASE_URL: http://127.0.0.1:4173
        run: node tests/platform-fee-caret.playwright.js

      - name: Verify Task 5 desktop and mobile pages
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node .github/tmp/seo-task5-browser.js

      - name: Confirm no tracked changes from verification
        run: git diff --exit-code
