name: SEO Task 4 GREEN Gate

on:
  push:
    branches:
      - feat/seo-growth-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task4-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply approved Home and Hourly SEO implementation
        run: python3 .github/tmp/seo-task4-apply.py

      - name: Verify Task 4 structure and protected regressions
        shell: bash
        run: |
          set +e
          node tests/seo-structure-regression.test.js 2>&1 | tee /tmp/seo-task4-green.log
          seo_status=${PIPESTATUS[0]}
          set -e
          if grep -Eq '^[0-9]+\. (home|hourly)' /tmp/seo-task4-green.log; then
            echo "A Task 4 Home/Hourly structural assertion is still failing."
            exit 1
          fi
          echo "Task 4 Home/Hourly structural assertions: PASS"
          echo "Overall SEO status: ${seo_status} (later Task 5/6 REDs may remain)."
          node tests/budget-planner-regression.test.js
          node tests/tax-estimator-regression.test.js
          node tests/android-download-page-release.test.js

      - name: Install temporary Playwright Chromium
        shell: bash
        run: |
          npm install --prefix /tmp/seo-pw playwright
          /tmp/seo-pw/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify Home and Hourly desktop/mobile behavior
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/seo-task4-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/hourly-rate-calculator.html >/dev/null; then break; fi
            sleep 1
          done
          NODE_PATH=/tmp/seo-pw/node_modules node .github/tmp/seo-task4-browser.js

      - name: Commit approved Task 4 product changes
        shell: bash
        run: |
          if git diff --quiet -- index.html hourly-rate-calculator.html; then
            echo "Task 4 product changes already committed; verification only."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hourly-rate-calculator.html
          git commit -m "feat: separate home and hourly SEO intent"
          git push origin HEAD:feat/seo-growth-v1

# Temporary committed-tree verification trigger for Task 4.
