name: SEO Task 1 Gate

on:
  push:
    branches:
      - feat/seo-growth-v1

jobs:
  task1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run SEO structure regression
        run: node tests/seo-structure-regression.test.js
