name: PR release validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression-and-browser:
    name: Regression and real exports
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Configure temporary test paths
        run: |
          {
            echo "NODE_PATH=$RUNNER_TEMP/release-checks/node_modules"
            echo "TAX_EXPORT_LIB_DIR=$RUNNER_TEMP/release-checks/node_modules"
            echo "IGP_EXPORT_LIB_DIR=$RUNNER_TEMP/export-libs"
            echo "TAX_ARTIFACT_DIR=$RUNNER_TEMP/release-evidence/tax-estimator"
            echo "IGP_ARTIFACT_DIR=$RUNNER_TEMP/release-evidence/income-goal"
            echo "HRC_EXPORT_LIB_DIR=$RUNNER_TEMP/release-checks/node_modules"
            echo "HRC_ARTIFACT_DIR=$RUNNER_TEMP/release-evidence/hourly"
          } >> "$GITHUB_ENV"
      - name: Node regressions
        run: |
          mkdir -p "$RUNNER_TEMP/release-evidence"
          node --test tests/*.test.js | tee "$RUNNER_TEMP/release-evidence/node.log"
      - name: Install browser and production export libraries for tests
        run: |
          npm install --prefix "$RUNNER_TEMP/release-checks" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.62.1 jspdf@2.5.1 html2canvas@1.4.1 html2pdf.js@0.10.1 pdf-lib@1.17.1
          node "$RUNNER_TEMP/release-checks/node_modules/playwright/cli.js" install --with-deps chromium
          mkdir -p "$IGP_EXPORT_LIB_DIR"
          ln -s "$TAX_EXPORT_LIB_DIR/html2canvas/dist/html2canvas.min.js" "$IGP_EXPORT_LIB_DIR/html2canvas.js"
          ln -s "$TAX_EXPORT_LIB_DIR/jspdf/dist/jspdf.umd.min.js" "$IGP_EXPORT_LIB_DIR/jspdf.js"
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=" + require("playwright").chromium.executablePath() + "\n")'
      - name: Platform Fee financial states, integrations and actual exports
        env:
          PFC_ARTIFACT_DIR: ${{ runner.temp }}/release-evidence/platform
        run: |
          node tests/platform-fee-remediation.playwright.js | tee "$RUNNER_TEMP/release-evidence/platform-browser.log"
          node -e 'require("node:assert/strict").match(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/release-evidence/platform-browser.log", "utf8"), /^RESULT passed=[1-9][0-9]* failed=0 skipped=0$/m)'
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/release-evidence/platform-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..50}; do curl --fail --silent http://127.0.0.1:4173/platform-fee-calculator.html -o /dev/null && break; sleep 0.1; done
          node tests/platform-fee-caret.playwright.js | tee "$RUNNER_TEMP/release-evidence/platform-caret.log"
      - name: Hourly Rate input integrity and native exports
        run: |
          node tests/hourly-rate.playwright.js | tee "$RUNNER_TEMP/release-evidence/hourly-browser.log"
          node -e 'require("node:assert/strict").match(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/release-evidence/hourly-browser.log", "utf8"), /^RESULT passed=[1-9][0-9]* failed=0 skipped=0$/m)'
      - name: Tax Estimator desktop, mobile and native exports
        run: |
          node tests/tax-estimator.playwright.js | tee "$RUNNER_TEMP/release-evidence/tax-browser.log"
          node -e 'require("node:assert/strict").match(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/release-evidence/tax-browser.log", "utf8"), /^RESULT passed=[1-9][0-9]* failed=0 skipped=0$/m)'
      - name: Income Goal Planner and native exports
        run: |
          node tests/income-goal-planner.playwright.js | tee "$RUNNER_TEMP/release-evidence/income-goal-browser.log"
          node -e 'require("node:assert/strict").match(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/release-evidence/income-goal-browser.log", "utf8"), /^RESULT passed=[1-9][0-9]* failed=0 skipped=0$/m)'
      - name: Save test logs and actual export files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-check-evidence
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 14
