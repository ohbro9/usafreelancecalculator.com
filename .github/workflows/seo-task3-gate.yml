name: SEO Task 3 Gate

on:
  push:
    branches:
      - feat/seo-growth-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task3-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply approved Budget SEO patch
        run: python3 .github/tmp/seo-task3-apply.py

      - name: Verify Budget math and Task 3 SEO assertions
        shell: bash
        run: |
          node tests/budget-planner-regression.test.js
          set +e
          node tests/seo-structure-regression.test.js 2>&1 | tee /tmp/seo-task3.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -qiE 'budget title|budget h1|budget description owns irregular-income budgeting intent|budget supporting heading|budget contextual link' /tmp/seo-task3.log; then
            echo "A Task 3 Budget SEO assertion is still failing."
            exit 1
          fi
          echo "Task 3 Budget SEO assertions: PASS"
          echo "Overall SEO status: ${status} (later-task REDs may remain)."

      - name: Install temporary Playwright Chromium
        shell: bash
        run: |
          npm install --prefix /tmp/seo-pw playwright
          /tmp/seo-pw/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify Budget desktop and mobile layout
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/seo-budget-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/budget-planner.html >/dev/null; then break; fi
            sleep 1
          done
          NODE_PATH=/tmp/seo-pw/node_modules node .github/tmp/seo-task3-browser.js

      - name: Commit approved Budget implementation
        shell: bash
        run: |
          if git diff --quiet -- budget-planner.html; then
            echo "Budget implementation already committed; verification only."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add budget-planner.html
          git commit -m "feat: strengthen budget planner search intent"
          git push origin HEAD:feat/seo-growth-v1
