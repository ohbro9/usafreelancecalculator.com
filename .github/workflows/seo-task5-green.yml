name: SEO Task 5 Green Gate

on:
  push:
    branches:
      - feat/seo-growth-v1
    paths:
      - .github/workflows/seo-task5-green.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seo-growth-v1
          fetch-depth: 0

      - name: Apply Task 5 product patch
        run: python3 .github/tmp/seo-task5-apply.py

      - name: Verify product scope and calculation regions untouched
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          expected = ['platform-fee-calculator.html', 'tax-estimator.html']
          if sorted(changed) != sorted(expected):
              raise SystemExit(f'Unexpected working-tree scope: {changed}')

          def from_head(path):
              return subprocess.check_output(['git','show',f'HEAD:{path}'], text=True)

          old_tax = from_head('tax-estimator.html')
          new_tax = Path('tax-estimator.html').read_text()
          tax_marker = '// ─── TAX DATA — DO NOT MODIFY'
          if old_tax.split(tax_marker,1)[1] != new_tax.split(tax_marker,1)[1]:
              raise SystemExit('Tax calculation/data region changed unexpectedly')

          old_platform = from_head('platform-fee-calculator.html')
          new_platform = Path('platform-fee-calculator.html').read_text()
          platform_marker = '<script>\nwindow.__PFC_PDF_TEMPLATE_CLIENT'
          if old_platform.split(platform_marker,1)[1] != new_platform.split(platform_marker,1)[1]:
              raise SystemExit('Platform export/calculation script region changed unexpectedly')

          print('PASS intended files only; protected calculation regions byte-identical')
          PY
          git diff --check

      - name: Run protected deterministic regressions
        run: |
          node tests/budget-planner-regression.test.js
          node tests/tax-estimator-regression.test.js
          node tests/android-download-page-release.test.js

      - name: Run permanent SEO structure gate with only later-task REDs allowed
        run: |
          set +e
          node tests/seo-structure-regression.test.js > /tmp/seo-task5.log 2>&1
          status=$?
          set -e
          cat /tmp/seo-task5.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/seo-task5.log').read_text()
          failures = []
          for line in text.splitlines():
              m = re.match(r'^\d+\. ([^:]+):', line)
              if m:
                  failures.append(m.group(1))
          allowed = {
              'income title',
              'income h1',
              'sitemap includes app page',
              '404 has root-safe home link',
              '404 has root-safe platform link',
          }
          unexpected = set(failures) - allowed
          missing = allowed - set(failures)
          if unexpected:
              raise SystemExit(f'Unexpected SEO failures after Task 5: {sorted(unexpected)}')
          if missing:
              raise SystemExit(f'Expected later-task REDs not observed: {sorted(missing)}')
          if len(failures) != len(allowed):
              raise SystemExit(f'Expected exactly {len(allowed)} later-task failures, got {len(failures)}')
          print('PASS Task 5 SEO assertions; exactly five later-task REDs remain')
          PY
          test "$status" -eq 1

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/task5-http.log 2>&1 &
          echo $! >/tmp/task5-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/platform-fee-calculator.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/task5-http.log
          exit 1

      - name: Run existing Platform cents and Android-caret regression
        env:
          PFC_BASE_URL: http://127.0.0.1:4173
        run: node tests/platform-fee-caret.playwright.js

      - name: Run Task 5 desktop and mobile browser QA
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node .github/tmp/seo-task5-browser.js

      - name: Final pre-commit diff audit
        run: |
          git diff --check
          echo 'Changed files:'
          git diff --name-only
          echo 'Diff stat:'
          git diff --stat
          test "$(git diff --name-only | sort | paste -sd ',' -)" = "platform-fee-calculator.html,tax-estimator.html"

      - name: Commit verified Task 5 product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform-fee-calculator.html tax-estimator.html
          git commit -m "feat: deepen platform and tax SEO trust"
          git push origin HEAD:feat/seo-growth-v1
          git rev-parse HEAD
